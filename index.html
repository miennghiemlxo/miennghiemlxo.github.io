<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vẽ miền nghiệm hệ bất phương trình bậc nhất hai ẩn - Lxo Toán THPT. Bản quyền © toanlxo.">
<meta name="author" content="toanlxo"><title>Vẽ Miền Nghiệm Lxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#ECF0F5;
  --surface:#FFFFFF;
  --surface-2:#F3F6FA;
  --line:#D8DFE9;
  --line-strong:#C1CBD8;
  --ink:#15223A;
  --ink-2:#4F5E77;
  --ink-3:#8290A6;
  --accent:#1B58D1;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4ECFC;
  --pen:#D8263B;
  --ok:#11824F; --ok-soft:#E1F4EA;
  --bad:#C4302A; --bad-soft:#FCE8E6;
  --warn:#8F5400; --warn-soft:#FFF1D6;
  --g-paper:#FFFFFF;
  --g-grid:#E3E8EF;
  --g-axis:#1B263B;
  --g-label:#2E3B52;
  --g-hatch:#A4AFBF;
  --g-shade:rgba(92,108,135,.03);
  --g-region:rgba(27,88,209,.08);
  --c1:#1B58D1; --c2:#0E8A5C; --c3:#C26A06; --c4:#7A3FE0; --c5:#0B7A91; --c6:#C2185B;
  --shadow:0 1px 2px rgba(21,34,58,.06), 0 4px 16px rgba(21,34,58,.05);
  --radius:14px;
  --font:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0C121D; --surface:#141C2B; --surface-2:#1A2436; --line:#27334A; --line-strong:#36445F;
    --ink:#E4EAF4; --ink-2:#A2B0C6; --ink-3:#6E7D97;
    --accent:#6E9DFF; --accent-ink:#0C121D; --accent-soft:#1B2A48;
    --pen:#FF5C70;
    --ok:#3FCB8C; --ok-soft:#10301F; --bad:#FF7B72; --bad-soft:#3A1717; --warn:#F2B454; --warn-soft:#33260E;
    --g-paper:#101826; --g-grid:#1E293C; --g-axis:#CBD5E4; --g-label:#B3C0D4; --g-hatch:#4B5A74;
    --g-shade:rgba(140,160,190,.03); --g-region:rgba(110,157,255,.10);
    --c1:#6E9DFF; --c2:#3FCB8C; --c3:#F2A14A; --c4:#B08CFF; --c5:#3CC3DB; --c6:#FF7AB6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.22);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0C121D; --surface:#141C2B; --surface-2:#1A2436; --line:#27334A; --line-strong:#36445F;
  --ink:#E4EAF4; --ink-2:#A2B0C6; --ink-3:#6E7D97;
  --accent:#6E9DFF; --accent-ink:#0C121D; --accent-soft:#1B2A48;
  --pen:#FF5C70;
  --ok:#3FCB8C; --ok-soft:#10301F; --bad:#FF7B72; --bad-soft:#3A1717; --warn:#F2B454; --warn-soft:#33260E;
  --g-paper:#101826; --g-grid:#1E293C; --g-axis:#CBD5E4; --g-label:#B3C0D4; --g-hatch:#4B5A74;
  --g-shade:rgba(140,160,190,.03); --g-region:rgba(110,157,255,.10);
  --c1:#6E9DFF; --c2:#3FCB8C; --c3:#F2A14A; --c4:#B08CFF; --c5:#3CC3DB; --c6:#FF7AB6;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.22);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,output{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:16px 20px;display:flex;flex-direction:column;gap:12px}

/* ---------- Khung nhập ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.brand-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel.collapsed .brand-bar{border-bottom-color:transparent}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;flex:none}
.brand-mark svg,.brand-mark img{width:100%;height:100%;display:block;border-radius:10px;object-fit:contain}
.brand-name{font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--accent);white-space:nowrap}
.brand-sep{width:1px;height:18px;background:var(--line-strong);flex:none}
.brand-sub{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.brand-sep,.brand-sub{display:none}}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.btn-soft:hover{background:var(--accent-soft);filter:brightness(.96)}
.icon-btn{width:34px;padding:0;justify-content:center;font-size:17px;line-height:1}
#collapseBtn svg{transition:transform .2s}
.panel.collapsed #collapseBtn svg{transform:rotate(180deg)}

.panel-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:14px 16px 16px}
@media (max-width:820px){.panel-body{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.ineq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ineq{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ineq:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ineq.invalid{border-color:var(--bad)}
.tag{display:flex;align-items:center;justify-content:center;min-width:46px;padding:0 10px;background:var(--surface-2);border-right:1px solid var(--line);color:var(--c);font:italic 600 15px var(--font);box-shadow:inset 3px 0 0 var(--c)}
.tag sub{font-style:normal;font-size:.7em;margin-left:1px}
.ineq input{border:0;outline:0;background:transparent;font:500 15px/1.2 var(--mono);padding:11px 12px;min-width:0;width:100%}
.ineq input::placeholder{color:var(--ink-3);font-weight:400}
.ineq .del{border:0;background:transparent;color:var(--ink-3);width:40px;cursor:pointer;display:grid;place-items:center}
.ineq .del:hover{color:var(--bad)}
.ineq .del svg{width:14px;height:14px}
.ineq .err{grid-column:1/-1;font-size:12.5px;color:var(--bad);background:var(--bad-soft);padding:6px 12px}

.row-actions{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--ink-3)}
.hint code{font-family:var(--mono);font-variant-ligatures:none;font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:1px 5px;border-radius:5px}

.m-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.m-coords{display:inline-flex;align-items:center;gap:4px;font:600 15px var(--mono);color:var(--pen);border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface)}
.m-coords input{width:66px;border:1px solid transparent;background:var(--surface-2);border-radius:6px;font:500 15px var(--mono);color:var(--ink);padding:5px 6px;text-align:center}
.m-coords input:focus{outline:0;border-color:var(--accent)}
.m-coords input.bad{border-color:var(--bad);background:var(--bad-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill svg{width:14px;height:14px;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check{--c:var(--c1);display:grid;grid-template-columns:34px minmax(0,1fr) 20px;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--surface-2);font:500 13.5px/1.4 var(--mono)}
.check.ok{background:var(--ok-soft)}
.check.bad{background:var(--bad-soft)}
.check .dt{color:var(--c);font:italic 600 15px var(--font)}
.check .dt sub{font-style:normal;font-size:.7em}
.check .expr{display:flex;flex-direction:column;overflow-x:auto;white-space:nowrap}
.check .norm{font-size:11.5px;color:var(--ink-3)}
.check .mark{display:grid;place-items:center}
.check .mark svg{width:16px;height:16px}
.check.ok .mark{color:var(--ok)}
.check.bad .mark{color:var(--bad)}
.check.muted{color:var(--ink-3);font-family:var(--font);font-size:13px}

.status-box{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;background:var(--surface-2);color:var(--ink-2)}
.status-box b{color:var(--ink);font-weight:600}
.status-box .verts{font-family:var(--mono);font-size:12.5px;color:var(--ink);margin-top:2px}
.status-box.warn{background:var(--warn-soft);color:var(--warn)}
.status-box.warn b{color:var(--warn)}

/* ---------- Thanh công cụ + đồ thị ---------- */
.workspace{display:flex;flex-direction:column;gap:12px}
.workspace:fullscreen{background:var(--bg);padding:12px;height:100%}
.workspace:fullscreen .stage{flex:1;height:auto;min-height:0}
.toolbar{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);height:30px;padding:0 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tool-group{display:inline-flex;align-items:center;gap:8px}
.tool-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.zoom-val{font:500 12px var(--mono);min-width:48px;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
input[type="range"]{accent-color:var(--accent);width:92px}
.check-tg{font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.check-tg input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.stage-btn{position:absolute;top:10px;right:10px;box-shadow:var(--shadow)}

.stage{position:relative;height:min(74vh,760px);min-height:360px;background:var(--g-paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.legend{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink-2);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sw{display:inline-block;width:18px;height:12px;border:1px solid var(--line-strong);border-radius:3px}
.sw-sol{background:linear-gradient(var(--g-region),var(--g-region)),var(--g-paper)}
.sw-hatch{background:repeating-linear-gradient(45deg,var(--g-hatch) 0 1px,transparent 1px 4px),var(--g-paper)}
.sw-line{display:inline-block;width:20px;border-top:2px solid var(--ink-2)}
.sw-line.dash{border-top-style:dashed}
.readout{position:absolute;left:10px;top:10px;font:500 12px var(--mono);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;pointer-events:none;font-variant-numeric:tabular-nums}

.foot{text-align:center;font-size:12.5px;color:var(--ink-3);padding-block:4px}
.foot b{color:var(--ink-2);font-weight:600}

@media (max-width:520px){
  .toolbar{gap:8px 12px}
  .tool-group .tool-label{display:none}
  .stage{height:68vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <section class="panel" id="panel" aria-label="Nhập hệ bất phương trình">
    <header class="brand-bar">
      <div class="brand">
        <span class="brand-mark">
          <!-- LOGO: thay khối <svg> bên dưới bằng <img src="logo.png" alt="Lxo Toán THPT"> để dùng logo riêng -->
          <svg viewBox="0 0 40 40" role="img" aria-label="Logo Lxo Toán THPT">
            <rect width="40" height="40" rx="10" fill="var(--accent)"/>
            <path d="M16.5 25 L28.5 25 L28.5 13 Z" fill="var(--accent-ink)" opacity=".38"/>
            <path d="M12 9v19.5h19" fill="none" stroke="var(--accent-ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">Lxo Toán THPT</span>
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-sub">Hệ bất phương trình bậc nhất hai ẩn</span>
      </div>
      <button type="button" class="btn" id="collapseBtn" aria-expanded="true" aria-controls="panelBody">
        <span>Thu gọn</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="panel-body" id="panelBody">
      <div class="col">
        <div class="col-label" id="ineqLabel">Nhập bất phương trình</div>
        <ol class="ineq-list" id="ineqList" aria-labelledby="ineqLabel"></ol>
        <div class="row-actions">
          <button type="button" class="btn btn-soft" id="addBtn">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            Thêm bất phương trình
          </button>
          <span class="hint">Gõ <code>&lt;=</code> cho ≤, <code>&gt;=</code> cho ≥. Enter để thêm dòng.</span>
        </div>
      </div>

      <div class="col">
        <div class="col-label">Kiểm tra điểm M</div>
        <div class="m-row">
          <div class="m-coords">
            <span>M(</span>
            <input id="mx" type="text" inputmode="decimal" autocomplete="off" aria-label="Hoành độ của M">
            <span>;</span>
            <input id="my" type="text" inputmode="decimal" autocomplete="off" aria-label="Tung độ của M">
            <span>)</span>
          </div>
          <span class="pill" id="verdict"></span>
        </div>
        <ul class="checks" id="checks" aria-live="polite"></ul>
        <div class="status-box" id="sysStatus"></div>
      </div>
    </div>
  </section>

  <section class="workspace" id="workspace" aria-label="Đồ thị miền nghiệm">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Thao tác chuột trên đồ thị">
        <button type="button" data-mode="drag" aria-pressed="true">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="currentColor"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Kéo điểm M</span>
        </button>
        <button type="button" data-mode="pan" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v13M1.5 8h13M6 3.5l2-2 2 2M6 12.5l2 2 2-2M3.5 6l-2 2 2 2M12.5 6l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Di chuyển</span>
        </button>
      </div>

      <div class="tool-group">
        <span class="tool-label">Thu phóng</span>
        <button type="button" class="btn icon-btn" id="zoomOut" aria-label="Thu nhỏ">−</button>
        <output class="zoom-val" id="zoomVal">100%</output>
        <button type="button" class="btn icon-btn" id="zoomIn" aria-label="Phóng to">+</button>
        <button type="button" class="btn" id="resetView" title="Đưa đồ thị về vị trí ban đầu">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Đặt lại</span>
        </button>
      </div>

      <label class="tool-group" for="fontSize"><span class="tool-label">Cỡ chữ</span><input type="range" id="fontSize" min="10" max="24" step="1"></label>
      <label class="tool-group" for="hatchWidth"><span class="tool-label">Nét gạch</span><input type="range" id="hatchWidth" min="0.5" max="3" step="0.25"></label>
      <label class="tool-group check-tg" for="showVerts"><input type="checkbox" id="showVerts"><span>Hiện đỉnh</span></label>
    </div>

    <div class="stage" id="stage">
      <canvas id="plot" tabindex="0" aria-label="Mặt phẳng tọa độ Oxy. Phím mũi tên di chuyển điểm M, phím + và − để thu phóng."></canvas>
      <div class="readout" id="readout" hidden></div>
      <button type="button" class="btn icon-btn stage-btn" id="fsBtn" title="Toàn màn hình" aria-label="Toàn màn hình">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="legend" aria-hidden="true">
        <span><i class="sw sw-sol"></i>Miền nghiệm</span>
        <span><i class="sw sw-hatch"></i>Bị gạch bỏ</span>
        <span><i class="sw-line"></i>Lấy bờ</span>
        <span><i class="sw-line dash"></i>Bỏ bờ</span>
      </div>
    </div>
  </section>

  <footer class="foot">Bản quyền © 2026 <b>toanlxo</b> · Lxo Toán THPT</footer>
</div>

<script>
(() => {
  'use strict';

  const EPS = 1e-9, BIG = 1e6, MINUS = '−';
  const FONT = '"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const STORE_KEY = 'lxo-mien-nghiem-v1';
  const LETTERS = 'ABCDEFGHIJKLNPQRSTUVWXYZ'; // bỏ M và O để không trùng điểm M, gốc O
  const DEFAULT_ROWS = ['x + y <= 4', '2x - y > -2', 'x - 2y <= 2'];
  const DEFAULT_CENTER = { x: 1, y: 1 };
  const MAX_ROWS = 12, MIN_S = 3, MAX_S = 3000;
  const OP_PRETTY = { '<=': '≤', '>=': '≥', '<': '<', '>': '>' };

  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const clean = (v) => (Math.abs(v) < 1e-12 ? 0 : parseFloat(v.toPrecision(12)));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const ICON = {
    x: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    ok: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    bad: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>'
  };

  /* ================= Phân tích bất phương trình ================= */
  class ParseError extends Error {}
  const Lin = (a, b, c) => ({ a, b, c });
  const isConst = (v) => Math.abs(v.a) < EPS && Math.abs(v.b) < EPS;
  const scale = (v, k) => Lin(v.a * k, v.b * k, v.c * k);
  const add = (u, v) => Lin(u.a + v.a, u.b + v.b, u.c + v.c);
  const sub = (u, v) => Lin(u.a - v.a, u.b - v.b, u.c - v.c);
  function mul(u, v) {
    if (isConst(u)) return scale(v, u.c);
    if (isConst(v)) return scale(u, v.c);
    throw new ParseError('Không phải bậc nhất (có tích của hai ẩn).');
  }
  function div(u, v) {
    if (!isConst(v)) throw new ParseError('Không chia cho biểu thức chứa ẩn.');
    if (Math.abs(v.c) < EPS) throw new ParseError('Có phép chia cho 0.');
    return scale(u, 1 / v.c);
  }
  function pow(u, v) {
    if (!isConst(v)) throw new ParseError('Số mũ phải là hằng số.');
    if (isConst(u)) return Lin(0, 0, Math.pow(u.c, v.c));
    if (Math.abs(v.c - 1) < EPS) return u;
    if (Math.abs(v.c) < EPS) return Lin(0, 0, 1);
    throw new ParseError('Không phải bậc nhất (có lũy thừa của ẩn).');
  }

  function normalize(s) {
    return s
      .replace(/[≤⩽]/g, '<=').replace(/[≥⩾]/g, '>=')
      .replace(/=</g, '<=').replace(/=>/g, '>=')
      .replace(/[−–—]/g, '-').replace(/[×·∙]/g, '*').replace(/[÷:]/g, '/')
      .replace(/\[/g, '(').replace(/\]/g, ')')
      .replace(/(\d),(?=\d)/g, '$1.')
      .replace(/X/g, 'x').replace(/Y/g, 'y');
  }

  function tokenize(s) {
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        let j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const str = s.slice(i, j);
        if (str === '.' || (str.match(/\./g) || []).length > 1) throw new ParseError(`Số không hợp lệ: "${str}".`);
        toks.push({ t: 'num', v: parseFloat(str) });
        i = j; continue;
      }
      if (ch === 'x' || ch === 'y' || '+-*/()^'.includes(ch)) { toks.push({ t: ch }); i++; continue; }
      throw new ParseError(`Ký tự không hợp lệ: "${ch}". Chỉ dùng x, y, số và + − * / ( ).`);
    }
    return toks;
  }

  function parseLinear(src) {
    const toks = tokenize(src);
    if (!toks.length) throw new ParseError('Biểu thức trống.');
    let p = 0;
    const peek = () => (toks[p] ? toks[p].t : null);
    const next = () => toks[p++];
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') {
        const op = next().t, w = term();
        v = op === '+' ? add(v, w) : sub(v, w);
      }
      return v;
    }
    function term() {
      let v = unary();
      for (;;) {
        const k = peek();
        if (k === '*' || k === '/') { next(); const w = unary(); v = k === '*' ? mul(v, w) : div(v, w); }
        else if (k === 'num' || k === 'x' || k === 'y' || k === '(') v = mul(v, power()); // nhân ngầm: 2x, 3(x+1)
        else break;
      }
      return v;
    }
    function unary() {
      if (peek() === '-') { next(); return scale(unary(), -1); }
      if (peek() === '+') { next(); return unary(); }
      return power();
    }
    function power() {
      let v = primary();
      if (peek() === '^') { next(); v = pow(v, unary()); }
      return v;
    }
    function primary() {
      const tk = next();
      if (!tk) throw new ParseError('Biểu thức chưa đầy đủ.');
      if (tk.t === 'num') return Lin(0, 0, tk.v);
      if (tk.t === 'x') return Lin(1, 0, 0);
      if (tk.t === 'y') return Lin(0, 1, 0);
      if (tk.t === '(') {
        const v = expr();
        if (peek() !== ')') throw new ParseError('Thiếu dấu ")".');
        next();
        return v;
      }
      throw new ParseError(`Thiếu số hoặc ẩn trước "${tk.t}".`);
    }
    const v = expr();
    if (p < toks.length) {
      const t = toks[p];
      throw new ParseError(t.t === ')' ? 'Thừa dấu ")".' : `Biểu thức không hợp lệ ở "${t.t === 'num' ? t.v : t.t}".`);
    }
    return v;
  }

  function parseIneq(raw) {
    const s = normalize(raw).trim();
    if (!s) return { empty: true };
    const ops = s.match(/<=|>=|<|>/g);
    if (!ops) return { error: s.includes('=') ? 'Đây là phương trình. Hãy dùng dấu <, >, ≤ hoặc ≥.' : 'Thiếu dấu so sánh <, >, ≤ hoặc ≥.' };
    if (ops.length > 1) return { error: 'Mỗi dòng chỉ nhập một bất phương trình.' };
    const op = ops[0], at = s.search(/<=|>=|<|>/);
    const lhs = s.slice(0, at), rhs = s.slice(at + op.length);
    if (lhs.includes('=') || rhs.includes('=')) return { error: 'Thừa dấu "=".' };
    if (!lhs.trim()) return { error: 'Thiếu vế trái.' };
    if (!rhs.trim()) return { error: 'Thiếu vế phải.' };
    try {
      const L = parseLinear(lhs), R = parseLinear(rhs);
      const f = sub(L, R);
      const a = clean(f.a), b = clean(f.b), c = clean(f.c);
      if (Math.abs(a) < EPS && Math.abs(b) < EPS) return { error: 'Bất phương trình phải chứa x hoặc y.' };
      const strict = op === '<' || op === '>';
      const sg = op === '<=' || op === '<' ? 1 : -1; // miền nghiệm: g = sg·f ≤ 0
      return { ok: true, a, b, c, op, strict, ga: sg * a, gb: sg * b, gc: sg * c, rhsZero: isConst(R) && Math.abs(R.c) < EPS };
    } catch (e) {
      if (e instanceof ParseError) return { error: e.message };
      throw e;
    }
  }

  /* ================= Định dạng số (dấu phẩy thập phân) ================= */
  function fmtNum(v, dec = 3) {
    const k = 10 ** dec;
    let r = Math.round(clean(v) * k) / k;
    if (Object.is(r, -0)) r = 0;
    return String(r).replace('.', ',').replace('-', MINUS);
  }
  function fmtFrac(v) {
    v = clean(v);
    for (let q = 1; q <= 60; q++) {
      const p = Math.round(v * q);
      if (Math.abs(v * q - p) < 1e-7) return q === 1 ? fmtNum(p) : (p < 0 ? MINUS : '') + Math.abs(p) + '/' + q;
    }
    return fmtNum(v, 2);
  }
  function joinTerms(terms) {
    let s = '';
    for (const [neg, body] of terms) s += s ? (neg ? ` ${MINUS} ` : ' + ') + body : (neg ? MINUS : '') + body;
    return s;
  }
  function fmtLinear(a, b, c) {
    const t = [];
    const coef = (m) => (Math.abs(m - 1) < EPS ? '' : fmtNum(m));
    if (Math.abs(a) > EPS) t.push([a < 0, coef(Math.abs(a)) + 'x']);
    if (Math.abs(b) > EPS) t.push([b < 0, coef(Math.abs(b)) + 'y']);
    if (Math.abs(c) > EPS) t.push([c < 0, fmtNum(Math.abs(c))]);
    return joinTerms(t) || '0';
  }
  function fmtSubst(r, P, val) {
    const wrap = (v) => (v < -EPS ? `(${fmtNum(v)})` : fmtNum(v));
    const t = [];
    if (Math.abs(r.a) > EPS) t.push([r.a < 0, `${fmtNum(Math.abs(r.a))}·${wrap(P.x)}`]);
    if (Math.abs(r.b) > EPS) t.push([r.b < 0, `${fmtNum(Math.abs(r.b))}·${wrap(P.y)}`]);
    if (Math.abs(r.c) > EPS) t.push([r.c < 0, fmtNum(Math.abs(r.c))]);
    return `${joinTerms(t)} = ${fmtNum(val)} ${OP_PRETTY[r.op]} 0`;
  }
  function holds(v, op) {
    switch (op) {
      case '<=': return v <= EPS;
      case '<': return v < -EPS;
      case '>=': return v >= -EPS;
      default: return v > EPS;
    }
  }

  /* ================= Hình học ================= */
  // Cắt đa giác, giữ phần a·x + b·y + c ≤ 0 (Sutherland–Hodgman)
  function clipPoly(poly, a, b, c) {
    const out = [], n = poly.length;
    for (let i = 0; i < n; i++) {
      const P = poly[i], Q = poly[(i + 1) % n];
      const fp = a * P.x + b * P.y + c, fq = a * Q.x + b * Q.y + c;
      if (fp <= 0) out.push(P);
      if ((fp < 0 && fq > 0) || (fp > 0 && fq < 0)) {
        const t = fp / (fp - fq);
        out.push({ x: P.x + t * (Q.x - P.x), y: P.y + t * (Q.y - P.y) });
      }
    }
    return out;
  }
  function polyArea(poly) {
    let s = 0;
    for (let i = 0; i < poly.length; i++) {
      const P = poly[i], Q = poly[(i + 1) % poly.length];
      s += P.x * Q.y - Q.x * P.y;
    }
    return s / 2;
  }
  // Đoạn của đường thẳng a·x + b·y + c = 0 nằm trong hình chữ nhật (Liang–Barsky)
  function clipLine(a, b, c, x0, x1, y0, y1) {
    const n = a * a + b * b, px = -a * c / n, py = -b * c / n, dx = -b, dy = a;
    let t0 = -Infinity, t1 = Infinity;
    const test = (p, q) => {
      if (Math.abs(p) < 1e-15) return q >= 0;
      const r = q / p;
      if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
      else { if (r < t0) return false; if (r < t1) t1 = r; }
      return true;
    };
    if (!test(-dx, px - x0) || !test(dx, x1 - px) || !test(-dy, py - y0) || !test(dy, y1 - py) || t0 > t1) return null;
    return [{ x: px + t0 * dx, y: py + t0 * dy }, { x: px + t1 * dx, y: py + t1 * dy }];
  }
  const resid = (k, p) => (k.ga * p.x + k.gb * p.y + k.gc) / Math.hypot(k.ga, k.gb);

  // Tính lại đỉnh chính xác bằng cách giải hệ hai đường bờ đi qua nó
  function refine(p, cons) {
    const tol = 1e-6 * (1 + Math.hypot(p.x, p.y));
    const act = cons.filter((k) => Math.abs(resid(k, p)) < tol);
    for (let i = 0; i < act.length; i++) {
      for (let j = i + 1; j < act.length; j++) {
        const P = act[i], Q = act[j];
        const det = P.ga * Q.gb - Q.ga * P.gb;
        if (Math.abs(det) < 1e-12 * Math.hypot(P.ga, P.gb) * Math.hypot(Q.ga, Q.gb)) continue;
        const x = clean((Q.gc * P.gb - P.gc * Q.gb) / det);
        const y = clean((Q.ga * P.gc - P.ga * Q.gc) / det);
        const active = cons.filter((k) => Math.abs(resid(k, { x, y })) < 1e-9 * (1 + Math.hypot(x, y)));
        return { x, y, active: active.length ? active : [P, Q] };
      }
    }
    return null;
  }

  function analyze(cons) {
    const A = { count: cons.length, empty: false, degenerate: false, bounded: false, vertices: [], strictEdge: false };
    if (!cons.length) return A;
    let poly = [{ x: -BIG, y: -BIG }, { x: BIG, y: -BIG }, { x: BIG, y: BIG }, { x: -BIG, y: BIG }];
    for (const k of cons) { poly = clipPoly(poly, k.ga, k.gb, k.gc); if (!poly.length) break; }
    const flat = poly.length > 0 && Math.abs(polyArea(poly)) < 1e-9;
    if (!poly.length || (flat && cons.some((k) => k.strict))) { A.empty = true; return A; }
    A.degenerate = flat;
    const onBox = (p) => Math.abs(p.x) > BIG * 0.999 || Math.abs(p.y) > BIG * 0.999;
    const n = poly.length;
    A.bounded = !poly.some(onBox);
    let start = 0;
    if (!A.bounded) {
      const i = poly.findIndex(onBox);
      for (let j = 1; j <= n; j++) if (!onBox(poly[(i + j) % n])) { start = (i + j) % n; break; }
    }
    const verts = [];
    for (let j = 0; j < n; j++) {
      const p = poly[(start + j) % n];
      if (onBox(p)) continue;
      const v = refine(p, cons);
      if (!v || verts.some((w) => Math.hypot(w.x - v.x, w.y - v.y) < 1e-7)) continue;
      verts.push(v);
    }
    if (A.bounded && verts.length) { // bắt đầu từ đỉnh bên trái nhất, đi ngược chiều kim đồng hồ
      let m = 0;
      verts.forEach((v, i) => { if (v.x < verts[m].x - 1e-9 || (Math.abs(v.x - verts[m].x) < 1e-9 && v.y < verts[m].y)) m = i; });
      verts.push(...verts.splice(0, m));
    }
    verts.forEach((v, i) => { v.name = LETTERS[i] || 'P' + (i + 1); v.open = v.active.some((k) => k.strict); });
    A.vertices = verts;
    A.strictEdge = verts.some((v) => v.open);
    return A;
  }

  /* ================= Trạng thái ================= */
  const state = { rows: [], M: { x: 1, y: 1 }, mode: 'drag', fontSize: 14, hatchWidth: 1, showVerts: true, collapsed: false };
  let uid = 0, cons = [], analysis = analyze([]);

  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { saved = null; }
    const texts = saved && Array.isArray(saved.rows) && saved.rows.length ? saved.rows.map(String).slice(0, MAX_ROWS) : DEFAULT_ROWS;
    state.rows = texts.map((t) => ({ id: ++uid, text: t, parsed: parseIneq(t), showErr: true }));
    if (!saved) return;
    if (saved.M && Number.isFinite(saved.M.x) && Number.isFinite(saved.M.y)) state.M = { x: saved.M.x, y: saved.M.y };
    if (saved.mode === 'drag' || saved.mode === 'pan') state.mode = saved.mode;
    if (Number.isFinite(saved.fontSize)) state.fontSize = clamp(saved.fontSize, 10, 24);
    if (Number.isFinite(saved.hatchWidth)) state.hatchWidth = clamp(saved.hatchWidth, 0.5, 3);
    if (typeof saved.showVerts === 'boolean') state.showVerts = saved.showVerts;
    if (typeof saved.collapsed === 'boolean') state.collapsed = saved.collapsed;
  }
  let saveTimer = 0;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          rows: state.rows.map((r) => r.text), M: state.M, mode: state.mode,
          fontSize: state.fontSize, hatchWidth: state.hatchWidth, showVerts: state.showVerts, collapsed: state.collapsed
        }));
      } catch (e) { /* trình duyệt chặn lưu trữ: bỏ qua */ }
    }, 300);
  }

  /* ================= Danh sách bất phương trình ================= */
  const listEl = $('#ineqList'), addBtn = $('#addBtn');

  function makeRow(row) {
    const li = document.createElement('li');
    li.className = 'ineq';
    li.innerHTML = `<span class="tag"></span><input type="text" id="ineq-${row.id}" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="next" placeholder="Ví dụ: 2x − y ≥ 1"><button type="button" class="del" aria-label="Xoá dòng này">${ICON.x}</button><div class="err" hidden></div>`;
    const input = li.querySelector('input');
    input.value = row.text;
    input.addEventListener('input', () => {
      row.text = input.value;
      row.parsed = parseIneq(row.text);
      row.showErr = false;
      clearTimeout(row.errTimer);
      row.errTimer = setTimeout(() => { row.showErr = true; syncRows(); }, 900);
      update();
    });
    input.addEventListener('blur', () => { clearTimeout(row.errTimer); row.showErr = true; syncRows(); });
    input.addEventListener('keydown', (e) => {
      const i = state.rows.indexOf(row);
      if (e.key === 'Enter') {
        e.preventDefault();
        if (i < state.rows.length - 1) focusRow(i + 1);
        else if (input.value.trim()) addRow();
      } else if (e.key === 'Backspace' && !input.value && state.rows.length > 1) {
        e.preventDefault();
        removeRow(row);
      } else if (e.key === 'ArrowDown' && i < state.rows.length - 1) { e.preventDefault(); focusRow(i + 1); }
      else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); focusRow(i - 1); }
    });
    li.querySelector('.del').addEventListener('click', () => removeRow(row));
    return li;
  }

  function syncRows() {
    [...listEl.children].forEach((li, i) => {
      const row = state.rows[i];
      li.style.setProperty('--c', `var(--c${(i % 6) + 1})`);
      li.querySelector('.tag').innerHTML = `d<sub>${i + 1}</sub>`;
      const input = li.querySelector('input');
      input.setAttribute('aria-label', `Bất phương trình d${i + 1}`);
      const bad = !!row.parsed.error && row.showErr;
      li.classList.toggle('invalid', bad);
      input.setAttribute('aria-invalid', bad ? 'true' : 'false');
      const err = li.querySelector('.err');
      err.hidden = !bad;
      err.textContent = bad ? row.parsed.error : '';
    });
    addBtn.disabled = state.rows.length >= MAX_ROWS;
  }

  function focusRow(i) {
    const input = listEl.children[i] && listEl.children[i].querySelector('input');
    if (!input) return;
    input.focus();
    const n = input.value.length;
    input.setSelectionRange(n, n);
  }
  function addRow(text = '') {
    if (state.rows.length >= MAX_ROWS) return;
    const row = { id: ++uid, text, parsed: parseIneq(text), showErr: false };
    state.rows.push(row);
    listEl.append(makeRow(row));
    update();
    focusRow(state.rows.length - 1);
  }
  function removeRow(row) {
    const i = state.rows.indexOf(row);
    if (i < 0) return;
    if (state.rows.length === 1) {
      row.text = ''; row.parsed = parseIneq('');
      listEl.children[0].querySelector('input').value = '';
      update(); focusRow(0);
      return;
    }
    state.rows.splice(i, 1);
    listEl.children[i].remove();
    update();
    focusRow(Math.max(0, i - 1));
  }

  /* ================= Kiểm tra điểm M ================= */
  const checksEl = $('#checks'), verdictEl = $('#verdict'), statusEl = $('#sysStatus');
  const mxEl = $('#mx'), myEl = $('#my');

  function renderChecks() {
    const M = state.M;
    let any = false, all = true, html = '';
    state.rows.forEach((row, i) => {
      const r = row.parsed;
      if (r.empty) return;
      const dt = `<span class="dt">d<sub>${i + 1}</sub></span>`;
      const style = `style="--c:var(--c${(i % 6) + 1})"`;
      if (!r.ok) { html += `<li class="check muted" ${style}>${dt}<span class="expr">Chưa đúng cú pháp</span><span class="mark"></span></li>`; return; }
      any = true;
      const val = r.a * M.x + r.b * M.y + r.c;
      const pass = holds(val, r.op);
      all = all && pass;
      const norm = r.rhsZero ? '' : `<span class="norm">${esc(fmtLinear(r.a, r.b, r.c) + ' ' + OP_PRETTY[r.op] + ' 0')}</span>`;
      html += `<li class="check ${pass ? 'ok' : 'bad'}" ${style}>${dt}<span class="expr">${norm}<span>${esc(fmtSubst(r, M, val))}</span></span><span class="mark" aria-label="${pass ? 'Thỏa mãn' : 'Không thỏa mãn'}">${pass ? ICON.ok : ICON.bad}</span></li>`;
    });
    checksEl.innerHTML = html;
    const name = `M(${fmtNum(M.x)}; ${fmtNum(M.y)})`;
    if (!any) { verdictEl.className = 'pill'; verdictEl.textContent = 'Chưa có bất phương trình hợp lệ'; }
    else if (all) { verdictEl.className = 'pill ok'; verdictEl.innerHTML = `${ICON.ok}${esc(name)} thuộc miền nghiệm`; }
    else { verdictEl.className = 'pill bad'; verdictEl.innerHTML = `${ICON.bad}${esc(name)} không thuộc miền nghiệm`; }
  }

  function renderStatus() {
    const A = analysis;
    statusEl.className = 'status-box';
    if (!A.count) { statusEl.textContent = 'Nhập ít nhất một bất phương trình để vẽ miền nghiệm.'; return; }
    if (A.empty) {
      statusEl.className = 'status-box warn';
      statusEl.innerHTML = '<b>Hệ vô nghiệm.</b> Không có điểm nào thỏa mãn đồng thời các bất phương trình.';
      return;
    }
    let html;
    const names = A.vertices.map((v) => v.name).join('');
    if (A.degenerate) html = `Miền nghiệm suy biến thành <b>${A.vertices.length > 1 ? 'đoạn thẳng ' + names : 'một điểm'}</b>.`;
    else if (A.bounded) {
      const n = A.vertices.length;
      const shape = { 3: 'tam giác', 4: 'tứ giác', 5: 'ngũ giác', 6: 'lục giác' }[n] || `đa giác ${n} đỉnh`;
      html = `Miền nghiệm là miền trong <b>${shape} ${names}</b>, ${A.strictEdge ? 'bỏ các cạnh nét đứt' : 'kể cả các cạnh'}.`;
    } else if (A.count === 1) {
      const k = cons[0];
      html = `Miền nghiệm là <b>nửa mặt phẳng</b> không bị gạch, ${k.strict ? 'bỏ' : 'kể cả'} bờ d<sub>${k.idx + 1}</sub>.`;
    } else html = 'Miền nghiệm là phần không bị gạch, <b>không bị chặn</b>.';
    if (A.vertices.length) html += `<div class="verts">Đỉnh: ${A.vertices.map((v) => esc(`${v.name}(${fmtFrac(v.x)}; ${fmtFrac(v.y)})`)).join(', ')}</div>`;
    statusEl.innerHTML = html;
  }

  function parseNumber(str) {
    try { const v = parseLinear(normalize(str)); return isConst(v) ? v.c : NaN; } catch (e) { return NaN; }
  }
  function syncMInputs(force) {
    if (force || document.activeElement !== mxEl) mxEl.value = fmtNum(state.M.x);
    if (force || document.activeElement !== myEl) myEl.value = fmtNum(state.M.y);
  }
  function onMoveM(syncInputs = true) {
    renderChecks();
    if (syncInputs) syncMInputs(false);
    requestDraw();
    save();
  }
  [mxEl, myEl].forEach((el, k) => {
    el.addEventListener('input', () => {
      const v = parseNumber(el.value);
      el.classList.toggle('bad', !Number.isFinite(v));
      if (Number.isFinite(v)) { state.M = k ? { x: state.M.x, y: clean(v) } : { x: clean(v), y: state.M.y }; onMoveM(false); }
    });
    el.addEventListener('blur', () => { el.classList.remove('bad'); syncMInputs(true); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
  });

  function update() {
    cons = [];
    state.rows.forEach((r, i) => { if (r.parsed.ok) cons.push(Object.assign({ idx: i }, r.parsed)); });
    analysis = analyze(cons);
    syncRows();
    renderChecks();
    renderStatus();
    requestDraw();
    save();
  }

  /* ================= Vẽ đồ thị ================= */
  const stage = $('#stage'), canvas = $('#plot'), ctx = canvas.getContext('2d');
  const zoomVal = $('#zoomVal'), readout = $('#readout');
  const view = { cx: DEFAULT_CENTER.x, cy: DEFAULT_CENTER.y, s: 40 };
  let W = 0, H = 0, DPR = 1, baseScale = 40, userMoved = false, queued = false, colors = null, drag = null;

  const toSX = (x) => W / 2 + (x - view.cx) * view.s;
  const toSY = (y) => H / 2 - (y - view.cy) * view.s;
  const toWX = (sx) => view.cx + (sx - W / 2) / view.s;
  const toWY = (sy) => view.cy - (sy - H / 2) / view.s;

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const g = (n) => cs.getPropertyValue(n).trim();
    return {
      paper: g('--g-paper'), grid: g('--g-grid'), axis: g('--g-axis'), label: g('--g-label'),
      hatch: g('--g-hatch'), shade: g('--g-shade'), region: g('--g-region'), pen: g('--pen'),
      series: [1, 2, 3, 4, 5, 6].map((i) => g('--c' + i))
    };
  }
  function gridStep() {
    const target = Math.max(34, state.fontSize * 2.8) / view.s;
    const p = 10 ** Math.floor(Math.log10(target));
    for (const m of [1, 2, 5]) if (m * p >= target) return m * p;
    return 10 * p;
  }
  const snapUnit = () => Math.min(1, gridStep());
  const snapTo = (v, u) => clean(Math.round(v / u) * u);

  function defaultScale() { return clamp(Math.min(W, H) / 13, 18, 64); }
  function resetView() {
    baseScale = defaultScale();
    view.cx = DEFAULT_CENTER.x; view.cy = DEFAULT_CENTER.y; view.s = baseScale;
    userMoved = false;
    requestDraw();
  }
  function zoomAt(sx, sy, f) {
    userMoved = true;
    const wx = toWX(sx), wy = toWY(sy);
    view.s = clamp(view.s * f, MIN_S, MAX_S);
    view.cx = wx - (sx - W / 2) / view.s;
    view.cy = wy + (sy - H / 2) / view.s;
    requestDraw();
  }
  function requestDraw() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(draw);
  }

  function tracePoly(poly) {
    ctx.beginPath();
    poly.forEach((p, i) => (i ? ctx.lineTo(toSX(p.x), toSY(p.y)) : ctx.moveTo(toSX(p.x), toSY(p.y))));
    ctx.closePath();
  }
  function haloText(t, x, y, color) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = colors.paper;
    ctx.strokeText(t, x, y);
    ctx.fillStyle = color;
    ctx.fillText(t, x, y);
  }
  function arrow(x, y, dx, dy) {
    const b = 10, w = 4.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - dx * b - dy * w, y - dy * b + dx * w);
    ctx.lineTo(x - dx * b + dy * w, y - dy * b - dx * w);
    ctx.closePath();
    ctx.fill();
  }
  function drawHatch() {
    // họ đường sx − sy = k, neo theo gốc O để nét gạch chạy theo khi kéo đồ thị
    const sp = 7 + state.hatchWidth * 3;
    const o = toSX(0) - toSY(0);
    ctx.beginPath();
    for (let k = o - Math.ceil((o + H) / sp) * sp; k <= W; k += sp) { ctx.moveTo(k, 0); ctx.lineTo(k + H, H); }
    ctx.strokeStyle = colors.hatch;
    ctx.lineWidth = state.hatchWidth;
    ctx.stroke();
  }

  function drawAxes(step, x0, x1, y0, y1) {
    const C = colors, fs = state.fontSize, lf = Math.round(fs * 0.86);
    const ox = toSX(0), oy = toSY(0);
    const showX = oy >= 0 && oy <= H, showY = ox >= 0 && ox <= W;
    const dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
    const kx0 = Math.ceil(x0 / step), kx1 = Math.floor(x1 / step);
    const ky0 = Math.ceil(y0 / step), ky1 = Math.floor(y1 / step);

    ctx.strokeStyle = C.axis; ctx.fillStyle = C.axis; ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (showX) {
      ctx.moveTo(0, oy); ctx.lineTo(W - 4, oy);
      for (let k = kx0; k <= kx1; k++) if (k) { const X = toSX(k * step); ctx.moveTo(X, oy - 3.5); ctx.lineTo(X, oy + 3.5); }
    }
    if (showY) {
      ctx.moveTo(ox, H); ctx.lineTo(ox, 4);
      for (let k = ky0; k <= ky1; k++) if (k) { const Y = toSY(k * step); ctx.moveTo(ox - 3.5, Y); ctx.lineTo(ox + 3.5, Y); }
    }
    ctx.stroke();
    if (showX) arrow(W - 2, oy, 1, 0);
    if (showY) arrow(ox, 2, 0, -1);

    ctx.font = `500 ${lf}px ${FONT}`;
    // số trên trục hoành (bám mép khi trục ra ngoài khung)
    let ly, xb;
    if (oy < 0) { ly = 6; xb = 'top'; }
    else if (oy > H - lf - 12) { ly = Math.min(oy, H) - 6; xb = 'bottom'; }
    else { ly = oy + 6; xb = 'top'; }
    ctx.textAlign = 'center'; ctx.textBaseline = xb;
    for (let k = kx0; k <= kx1; k++) {
      if (!k) continue;
      const X = toSX(k * step);
      if (X < 12 || X > W - 22) continue;
      haloText(fmtNum(k * step, dec), X, ly, C.label);
    }
    // số trên trục tung
    let lx, ya;
    if (ox > W) { lx = W - 6; ya = 'right'; }
    else if (ox < lf * 2.4 + 8) { lx = Math.max(ox, 0) + 7; ya = 'left'; }
    else { lx = ox - 7; ya = 'right'; }
    ctx.textAlign = ya; ctx.textBaseline = 'middle';
    for (let k = ky0; k <= ky1; k++) {
      if (!k) continue;
      const Y = toSY(k * step);
      if (Y < 22 || Y > H - 12) continue;
      haloText(fmtNum(k * step, dec), lx, Y, C.label);
    }
    // O, x, y
    if (showX && showY) {
      ctx.font = `700 ${lf}px ${FONT}`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      haloText('O', ox - 6, oy + 5, C.axis);
    }
    ctx.font = `italic 600 ${fs + 1}px ${FONT}`;
    if (showX) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; haloText('x', W - 8, oy - 7, C.axis); }
    if (showY) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; haloText('y', ox + 9, 4, C.axis); }
  }

  function drawSubLabel(main, sub, x, y, color) {
    const fs = state.fontSize;
    const f1 = `italic 600 ${fs + 1}px ${FONT}`, f2 = `600 ${Math.round(fs * 0.72)}px ${FONT}`;
    ctx.font = f1; const w1 = ctx.measureText(main).width;
    ctx.font = f2; const w2 = ctx.measureText(sub).width;
    const sx = x - (w1 + w2) / 2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = f1; haloText(main, sx, y, color);
    ctx.font = f2; haloText(sub, sx + w1 + 0.5, y + fs * 0.32, color);
  }

  function drawBoundary(k, x0, x1, y0, y1) {
    const seg = clipLine(k.a, k.b, k.c, x0, x1, y0, y1);
    if (!seg) return;
    const color = colors.series[k.idx % 6];
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    if (k.strict) ctx.setLineDash([10, 7]);
    ctx.beginPath();
    ctx.moveTo(toSX(seg[0].x), toSY(seg[0].y));
    ctx.lineTo(toSX(seg[1].x), toSY(seg[1].y));
    ctx.stroke();
    ctx.restore();
    // nhãn d_k gần đầu mút phía trên-phải, lệch về phía miền nghiệm
    const pad = 24 / view.s;
    const inner = clipLine(k.a, k.b, k.c, x0 + pad, x1 - pad, y0 + pad, y1 - pad);
    if (!inner) return;
    let [P, Q] = inner.map((p) => ({ x: toSX(p.x), y: toSY(p.y) }));
    if (Q.x - Q.y > P.x - P.y) [P, Q] = [Q, P];
    const len = Math.hypot(Q.x - P.x, Q.y - P.y) || 1;
    const t = Math.min(26, len / 2) / len;
    const nx = -k.ga, ny = k.gb, nl = Math.hypot(nx, ny) || 1;
    drawSubLabel('d', String(k.idx + 1), P.x + (Q.x - P.x) * t + (nx / nl) * 14, P.y + (Q.y - P.y) * t + (ny / nl) * 14, color);
  }

  function drawVertices() {
    const C = colors, fs = state.fontSize;
    for (const v of analysis.vertices) {
      const X = toSX(v.x), Y = toSY(v.y);
      if (X < -20 || X > W + 20 || Y < -20 || Y > H + 20) continue;
      ctx.beginPath();
      ctx.arc(X, Y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = v.open ? C.paper : C.axis;
      ctx.fill();
      ctx.lineWidth = 1.8; ctx.strokeStyle = C.axis; ctx.stroke();
      // đặt nhãn ra phía ngoài miền nghiệm
      let dx = 0, dy = 0;
      for (const k of v.active) { const l = Math.hypot(k.ga, k.gb); dx += k.ga / l; dy -= k.gb / l; }
      const dl = Math.hypot(dx, dy);
      if (dl < 1e-6) { dx = 0.7; dy = -0.7; } else { dx /= dl; dy /= dl; }
      ctx.font = `600 ${Math.round(fs * 0.9)}px ${FONT}`;
      ctx.textAlign = dx > 0.35 ? 'left' : dx < -0.35 ? 'right' : 'center';
      ctx.textBaseline = dy > 0.35 ? 'top' : dy < -0.35 ? 'bottom' : 'middle';
      haloText(`${v.name}(${fmtFrac(v.x)}; ${fmtFrac(v.y)})`, X + dx * 10, Y + dy * 10, C.axis);
    }
  }

  function drawM() {
    const C = colors, fs = state.fontSize, M = state.M;
    const X = toSX(M.x), Y = toSY(M.y);
    if (X < -40 || X > W + 40 || Y < -40 || Y > H + 40) return;
    const ox = clamp(toSX(0), 0, W), oy = clamp(toSY(0), 0, H);
    ctx.save();
    ctx.setLineDash([3, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = C.pen; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X, oy); ctx.moveTo(X, Y); ctx.lineTo(ox, Y); ctx.stroke();
    ctx.restore();
    if (drag && drag.type === 'm') {
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = C.pen;
      ctx.beginPath(); ctx.arc(X, Y, 15, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(X, Y, 6.5, 0, Math.PI * 2);
    ctx.fillStyle = C.pen; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = C.paper; ctx.stroke();
    ctx.font = `700 ${fs}px ${FONT}`;
    const label = `M(${fmtNum(M.x)}; ${fmtNum(M.y)})`;
    const right = X + 12 + ctx.measureText(label).width < W - 6;
    ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'bottom';
    haloText(label, right ? X + 10 : X - 10, Y - 8, C.pen);
  }

  function draw() {
    queued = false;
    if (!W || !H) return;
    if (!colors) colors = readColors();
    const C = colors;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = C.paper;
    ctx.fillRect(0, 0, W, H);

    const x0 = toWX(0), x1 = toWX(W), y0 = toWY(H), y1 = toWY(0);
    const m = 4 / view.s;
    const viewPoly = [{ x: x0 - m, y: y0 - m }, { x: x1 + m, y: y0 - m }, { x: x1 + m, y: y1 + m }, { x: x0 - m, y: y1 + m }];
    const step = gridStep();

    // lưới ô vuông
    ctx.lineWidth = 1; ctx.strokeStyle = C.grid;
    ctx.beginPath();
    for (let k = Math.ceil(x0 / step); k * step <= x1; k++) { const X = Math.round(toSX(k * step)) + 0.5; ctx.moveTo(X, 0); ctx.lineTo(X, H); }
    for (let k = Math.ceil(y0 / step); k * step <= y1; k++) { const Y = Math.round(toSY(k * step)) + 0.5; ctx.moveTo(0, Y); ctx.lineTo(W, Y); }
    ctx.stroke();

    // tô nhạt miền nghiệm
    if (cons.length && !analysis.empty) {
      let sol = viewPoly;
      for (const k of cons) { sol = clipPoly(sol, k.ga, k.gb, k.gc); if (sol.length < 3) break; }
      if (sol.length >= 3) { tracePoly(sol); ctx.fillStyle = C.region; ctx.fill(); }
    }
    // gạch bỏ phần không thỏa mãn của từng bất phương trình
    for (const k of cons) {
      const ex = clipPoly(viewPoly, -k.ga, -k.gb, -k.gc);
      if (ex.length < 3) continue;
      ctx.save();
      tracePoly(ex); ctx.clip();
      ctx.fillStyle = C.shade; ctx.fillRect(0, 0, W, H);
      drawHatch();
      ctx.restore();
    }

    drawAxes(step, x0, x1, y0, y1);
    for (const k of cons) drawBoundary(k, x0, x1, y0, y1);
    if (state.showVerts) drawVertices();
    drawM();
    zoomVal.textContent = Math.round((view.s / baseScale) * 100) + '%';
  }

  new ResizeObserver(() => {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    W = r.width; H = r.height; DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    if (!userMoved) resetView(); // chưa thu phóng/kéo tay thì tự căn lại theo khung mới
    draw();
  }).observe(stage);

  /* ================= Chuột, cảm ứng, bàn phím ================= */
  const pts = new Map();
  const rel = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const nearM = (p, touch) => Math.hypot(p.x - toSX(state.M.x), p.y - toSY(state.M.y)) <= (touch ? 26 : 14);

  function setMFromScreen(p) {
    const u = snapUnit();
    const x = snapTo(toWX(p.x), u), y = snapTo(toWY(p.y), u);
    if (x !== state.M.x || y !== state.M.y) { state.M = { x, y }; onMoveM(); }
    else requestDraw();
  }
  function updateCursor(p) {
    let c = state.mode === 'drag' ? 'crosshair' : 'grab';
    if (drag) c = 'grabbing';
    else if (p && nearM(p, false)) c = 'grab';
    canvas.style.cursor = c;
  }
  function showReadout(p) {
    const dec = Math.max(1, -Math.floor(Math.log10(gridStep())) + 1);
    readout.hidden = false;
    readout.textContent = `x = ${fmtNum(toWX(p.x), dec)};  y = ${fmtNum(toWY(p.y), dec)}`;
  }

  canvas.addEventListener('pointerdown', (e) => {
    const p = rel(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* bỏ qua */ }
    pts.set(e.pointerId, p);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      drag = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: view.s, wx: toWX(mid.x), wy: toWY(mid.y) };
      return;
    }
    if (pts.size > 2) return;
    const panButton = e.button === 1 || e.button === 2;
    if (!panButton && (state.mode === 'drag' || nearM(p, e.pointerType === 'touch'))) {
      drag = { type: 'm' };
      setMFromScreen(p);
    } else {
      drag = { type: 'pan', x: p.x, y: p.y, cx: view.cx, cy: view.cy };
    }
    updateCursor(p);
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = rel(e);
    if (pts.has(e.pointerId)) pts.set(e.pointerId, p);
    if (drag && drag.type === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      view.s = clamp((drag.s0 * Math.hypot(a.x - b.x, a.y - b.y)) / drag.d0, MIN_S, MAX_S);
      view.cx = drag.wx - (mid.x - W / 2) / view.s;
      view.cy = drag.wy + (mid.y - H / 2) / view.s;
      userMoved = true;
      requestDraw();
    } else if (drag && drag.type === 'm') {
      setMFromScreen(p);
    } else if (drag && drag.type === 'pan') {
      userMoved = true;
      view.cx = drag.cx - (p.x - drag.x) / view.s;
      view.cy = drag.cy + (p.y - drag.y) / view.s;
      requestDraw();
    }
    if (e.pointerType === 'mouse') showReadout(p);
    updateCursor(p);
  });
  function endPointer(e) {
    pts.delete(e.pointerId);
    if (!pts.size || (drag && drag.type === 'pinch')) { drag = null; requestDraw(); }
    updateCursor(rel(e));
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { readout.hidden = true; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const p = rel(e);
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomAt(p.x, p.y, Math.exp(-d * 0.0015));
  }, { passive: false });
  canvas.addEventListener('keydown', (e) => {
    const u = snapUnit();
    let dx = 0, dy = 0;
    if (e.key === 'ArrowLeft') dx = -u;
    else if (e.key === 'ArrowRight') dx = u;
    else if (e.key === 'ArrowUp') dy = u;
    else if (e.key === 'ArrowDown') dy = -u;
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomAt(W / 2, H / 2, 1.25); return; }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomAt(W / 2, H / 2, 0.8); return; }
    else return;
    e.preventDefault();
    state.M = { x: snapTo(state.M.x + dx, u), y: snapTo(state.M.y + dy, u) };
    onMoveM();
  });

  /* ================= Thanh công cụ ================= */
  const modeBtns = document.querySelectorAll('[data-mode]');
  function syncMode() { modeBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode))); updateCursor(null); }
  modeBtns.forEach((b) => b.addEventListener('click', () => { state.mode = b.dataset.mode; syncMode(); save(); }));

  $('#zoomIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.25));
  $('#zoomOut').addEventListener('click', () => zoomAt(W / 2, H / 2, 0.8));
  $('#resetView').addEventListener('click', resetView);

  const fontEl = $('#fontSize'), hatchEl = $('#hatchWidth'), vertEl = $('#showVerts');
  fontEl.addEventListener('input', () => { state.fontSize = +fontEl.value; requestDraw(); save(); });
  hatchEl.addEventListener('input', () => { state.hatchWidth = +hatchEl.value; requestDraw(); save(); });
  vertEl.addEventListener('change', () => { state.showVerts = vertEl.checked; requestDraw(); save(); });
  addBtn.addEventListener('click', () => addRow());

  const panel = $('#panel'), panelBody = $('#panelBody'), collapseBtn = $('#collapseBtn');
  function syncCollapse() {
    panelBody.hidden = state.collapsed;
    panel.classList.toggle('collapsed', state.collapsed);
    collapseBtn.setAttribute('aria-expanded', String(!state.collapsed));
    collapseBtn.querySelector('span').textContent = state.collapsed ? 'Mở rộng' : 'Thu gọn';
  }
  collapseBtn.addEventListener('click', () => { state.collapsed = !state.collapsed; syncCollapse(); save(); });

  const workspace = $('#workspace'), fsBtn = $('#fsBtn');
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    const r = document.fullscreenElement ? document.exitFullscreen() : workspace.requestFullscreen();
    if (r && r.catch) r.catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? 'Thoát toàn màn hình' : 'Toàn màn hình';
    fsBtn.title = label;
    fsBtn.setAttribute('aria-label', label);
  });

  // Đổi giao diện sáng/tối thì đọc lại màu
  const refreshColors = () => { colors = null; requestDraw(); };
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', refreshColors);
  }
  new MutationObserver(refreshColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  if (document.fonts) {
    Promise.all([
      document.fonts.load(`500 12px ${FONT}`),
      document.fonts.load(`700 14px ${FONT}`),
      document.fonts.load(`italic 600 14px ${FONT}`)
    ]).then(requestDraw, () => {});
  }

  /* ================= Khởi động ================= */
  load();
  listEl.textContent = '';
  state.rows.forEach((row) => listEl.append(makeRow(row)));
  fontEl.value = state.fontSize;
  hatchEl.value = state.hatchWidth;
  vertEl.checked = state.showVerts;
  syncMode();
  syncCollapse();
  syncMInputs(true);
  update();
})();
</script>
</body>
</html>
